name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build -- --webpack
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: python -m pip install -e './backend[dev]' pip-audit
      - run: python -m pip_audit backend
      - run: python -m compileall -q backend/app
      - run: python -m pytest backend/tests

  deployment-files:
    runs-on: ubuntu-latest
    env:
      CORS_ORIGINS: https://mergen.example.org
      SITE_ADDRESS: mergen.example.org
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ANALYTICS_PASSWORD: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy.sh
      - run: docker compose config >/dev/null
