services:
  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:size=1G,mode=1777
    volumes:
      - ./backend/models:/app/models:ro
      - backend-data:/app/data
    environment:
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the public site origin}
      MODEL_DIR: /app/models
      TASK_BASE_DIR: /app/data/tasks
      ANALYTICS_DB_PATH: /app/data/analytics.db
      MAX_POOL_WORKERS: ${MAX_POOL_WORKERS:-2}
      TASK_TTL_MINUTES: ${TASK_TTL_MINUTES:-60}
      TASK_CLEANUP_INTERVAL_SECONDS: ${TASK_CLEANUP_INTERVAL_SECONDS:-300}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      MAX_BATCH_ENTRIES: ${MAX_BATCH_ENTRIES:-1000}
      MAX_BATCH_UNCOMPRESSED_BYTES: ${MAX_BATCH_UNCOMPRESSED_BYTES:-1073741824}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a long random value}
      ANALYTICS_USERNAME: ${ANALYTICS_USERNAME:-admin}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:?Set ANALYTICS_PASSWORD to a strong value}
    mem_limit: 4g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_BACKEND_URL: http://backend:8000
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:size=64M,mode=1777
    environment:
      - INTERNAL_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the public domain name}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  backend-data:
  caddy-data:
  caddy-config:
